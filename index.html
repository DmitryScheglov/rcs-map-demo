<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>rcs construction — Projects Map (Demo)</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    .topbar {
      padding: 12px 16px;
      border-bottom: 1px solid #e5e5e5;
      font-weight: bold;
    }

    .layout {
      display: flex;
      flex: 1;
      overflow: hidden;
    }

    /* Sidebar (40% narrower than original 360px) */
    .sidebar {
      width: 216px;
      min-width: 200px;
      border-right: 1px solid #e5e5e5;
      background: #fff;
      display: flex;
      flex-direction: column;
    }

    .search {
      padding: 10px;
      border-bottom: 1px solid #eee;
    }

    .search input {
      width: 100%;
      padding: 6px;
      font-size: 14px;
    }

    .list {
      flex: 1;
      overflow-y: auto;
    }

    .category {
      padding: 8px 10px;
      font-weight: bold;
      background: #f7f7f7;
      border-bottom: 1px solid #eee;
      cursor: pointer;
    }

    .item {
      padding: 8px 10px;
      border-bottom: 1px solid #f0f0f0;
      cursor: pointer;
    }

    .item:hover {
      background: #f5f5f5;
    }

    #map {
      flex: 1;
    }

    /* Custom popup styling */
    .kml-popup {
      max-width: 1050px;
    }

    .kml-popup img {
      max-height: 400px;  /* Auto compress image height */
      width: auto;
      max-width: 100%;
      display: block;
      margin: 0 auto;
    }
  </style>
</head>

<body>

  <div class="topbar">
    rcs construction — Projects Map (Demo)
  </div>

  <div class="layout">
    <div class="sidebar">
      <div class="search">
        <input type="text" id="searchInput" placeholder="Search location name..." />
      </div>
      <div class="list" id="locationList"></div>
    </div>

    <div id="map"></div>
  </div>

  <script>
    const KML_URL = "./rcs construction Projects Crossing.kml";

    let map;
    let infoWindow;
    let locations = [];

    function initMap() {

      // Initialize map in satellite mode
      map = new google.maps.Map(document.getElementById("map"), {
        zoom: 7,
        center: { lat: 44.6488, lng: -63.5752 },
        mapTypeId: 'satellite'
      });

      infoWindow = new google.maps.InfoWindow({
        maxWidth: 1050
      });

      // Load KML layer
      const kmlLayer = new google.maps.KmlLayer({
        url: KML_URL,
        map: map,
        preserveViewport: false,
        suppressInfoWindows: true
      });

      // Handle KML marker click
      kmlLayer.addListener("click", (event) => {
        const lat = event.latLng.lat();
        const lng = event.latLng.lng();

        panWithPopupPadding(lat, lng);

        openPopup(
          event.featureData.name,
          event.featureData.infoWindowHtml,
          event.latLng
        );
      });

      // Fetch and parse KML for sidebar list
      fetch(KML_URL)
        .then(res => res.text())
        .then(str => {
          const parser = new DOMParser();
          const xml = parser.parseFromString(str, "text/xml");
          parseKml(xml);
          renderList();
        });
    }

    function parseKml(xml) {
      const placemarks = xml.getElementsByTagName("Placemark");

      for (let pm of placemarks) {
        const name = pm.getElementsByTagName("name")[0]?.textContent || "";
        const descNode = pm.getElementsByTagName("description")[0];
        const description = descNode ? descNode.textContent : "";

        const coordsNode = pm.getElementsByTagName("coordinates")[0];
        if (!coordsNode) continue;

        const coordsText = coordsNode.textContent.trim();
        const [lng, lat] = coordsText.split(",");

        locations.push({
          name,
          descriptionHtml: description,
          lat: parseFloat(lat),
          lng: parseFloat(lng)
        });
      }
    }

    function renderList() {
      const container = document.getElementById("locationList");
      container.innerHTML = "";

      locations.forEach(item => {

        const row = document.createElement("div");
        row.className = "item";
        row.innerHTML = `<strong>${item.name}</strong><br/>
                         <small>${item.lat.toFixed(5)}, ${item.lng.toFixed(5)}</small>`;

        row.addEventListener("click", () => {
          const pos = new google.maps.LatLng(item.lat, item.lng);

          map.setZoom(Math.max(map.getZoom(), 14));
          panWithPopupPadding(item.lat, item.lng);

          openPopup(item.name, item.descriptionHtml, pos);
        });

        container.appendChild(row);
      });
    }

    function openPopup(title, html, position) {
      infoWindow.setContent(`
        <div class="kml-popup">
          <h3>${title}</h3>
          ${html}
        </div>
      `);

      infoWindow.setPosition(position);
      infoWindow.open(map);
    }

    // Move map slightly south so popup fits fully on screen
    function panWithPopupPadding(lat, lng) {
      const zoom = map.getZoom() || 12;

      const offsetByZoom = {
        7: 0.15,
        8: 0.10,
        9: 0.07,
        10: 0.05,
        11: 0.035,
        12: 0.025,
        13: 0.018,
        14: 0.012,
        15: 0.008
      };

      const keys = Object.keys(offsetByZoom).map(Number).sort((a,b) => a-b);
      let closest = keys[0];

      for (const k of keys) {
        if (zoom >= k) closest = k;
      }

      const latShift = offsetByZoom[closest];
      map.panTo({ lat: lat - latShift, lng });
    }

    // Search filter
    document.addEventListener("input", function(e) {
      if (e.target.id === "searchInput") {
        const value = e.target.value.toLowerCase();
        const items = document.querySelectorAll(".item");

        items.forEach(item => {
          item.style.display =
            item.textContent.toLowerCase().includes(value)
              ? "block"
              : "none";
        });
      }
    });

  </script>

  <script async
    src="https://maps.googleapis.com/maps/api/js?key=AIzaSyBQJdAz47je6PT8EWNTBQKKCKwbh1DbpLs&callback=initMap">
  </script>

</body>
</html>
