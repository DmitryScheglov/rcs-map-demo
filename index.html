<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>rcs construction Projects Map (Demo)</title>
  <style>
    body { margin: 0; font-family: Arial, sans-serif; }
    .topbar { padding: 12px 16px; border-bottom: 1px solid #e5e5e5; }
    #map { height: calc(100vh - 49px); width: 100%; }
  </style>
</head>
<body>
  <div class="topbar">rcs construction — Projects Map (Demo)</div>
  <div id="map"></div>

  <script>
    function initMap() {
      const map = new google.maps.Map(document.getElementById("map"), {
        zoom: 6,
        center: { lat: 44.6488, lng: -63.5752 }
      });

      new google.maps.KmlLayer({
        url: "https://DmitryScheglov.github.io/rcs-map-demo/rcs%20construction%20Projects%20Crossing.kml",
        map: map,
        preserveViewport: false
      });
    }
  </script>

  <script async
    src="https://maps.googleapis.com/maps/api/js?key=YOUR_API_KEY&callback=initMap">
  </script>
</body>
</html>
