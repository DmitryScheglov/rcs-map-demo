<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>rcs construction Projects Map (Demo)</title>

  <style>
    /* Page layout */
    html, body { height: 100%; margin: 0; font-family: Arial, sans-serif; }
    .topbar { padding: 12px 16px; border-bottom: 1px solid #e5e5e5; background: #fff; }

    /* Two-column layout: left panel + map */
    .layout { display: flex; height: calc(100vh - 49px); }
    .sidebar {
      width: 360px;
      min-width: 280px;
      max-width: 420px;
      border-right: 1px solid #e5e5e5;
      background: #fff;
      display: flex;
      flex-direction: column;
    }
    .sidebar .search {
      padding: 12px;
      border-bottom: 1px solid #e5e5e5;
    }
    .sidebar input {
      width: 100%;
      box-sizing: border-box;
      padding: 10px 12px;
      border: 1px solid #ddd;
      border-radius: 8px;
      outline: none;
    }
    .list {
      overflow: auto;
      padding: 8px;
      flex: 1;
    }
    .item {
      padding: 10px 10px;
      border-radius: 8px;
      cursor: pointer;
      display: flex;
      gap: 10px;
      align-items: center;
    }
    .item:hover { background: #f6f6f6; }
    .dot {
      width: 10px; height: 10px; border-radius: 50%;
      background: #666;
      flex: 0 0 10px;
    }
    .name { font-size: 14px; line-height: 1.2; color: #111; }
    .meta { font-size: 12px; color: #666; margin-top: 2px; }

    /* Map container */
    #map { flex: 1; }

    /* Custom popup wrapper */
    .kml-popup { max-width: 1050px; }

    /* Auto-limit images inside KML popup to fit height */
    .kml-popup img {
      max-width: 100%;
      height: auto;
      display: block;

      /* Key part: limit image height to 400px */
      max-height: 400px;
      object-fit: contain;
    }
  </style>
</head>

<body>
  <div class="topbar">rcs construction — Projects Map (Demo)</div>

  <div class="layout">
    <div class="sidebar">
      <div class="search">
        <input id="searchBox" type="text" placeholder="Search location name..." />
      </div>
      <div id="list" class="list"></div>
    </div>

    <div id="map"></div>
  </div>

  <script>
    // =========================
    // 1) CONFIG (edit these)
    // =========================

    // IMPORTANT:
    // Put your KML file in the SAME repo folder as index.html
    // and name it "projects.kml" (recommended).
    //
    // Example repo structure:
    //   /index.html
    //   /projects.kml
    //
    // Then it will be available at:
    //   https://dmitryscheglov.github.io/rcs-map-demo/projects.kml
    const KML_URL = "./rcs construction Projects Crossing.kml";

    // Default view (Halifax area)
    const DEFAULT_CENTER = { lat: 44.6488, lng: -63.5752 };
    const DEFAULT_ZOOM = 6;

    // =========================
    // 2) GLOBALS
    // =========================
    let map;
    let infoWindow;
    let kmlLayer;

    // Local copy of KML placemarks for the left list
    // Each item: { name, lat, lng, descriptionHtml }
    let placemarks = [];

    // =========================
    // 3) MAP INIT (called by Google Maps)
    // =========================
    function initMap() {
      // Create the map
      map = new google.maps.Map(document.getElementById("map"), {
        center: DEFAULT_CENTER,
        zoom: DEFAULT_ZOOM,
        mapTypeId: google.maps.MapTypeId.SATELLITE, // Start in satellite mode
        // Optional: show map type control (Map / Satellite buttons)
        mapTypeControl: true,
      });

      // Create one InfoWindow for all clicks
      infoWindow = new google.maps.InfoWindow({ maxWidth: 1050 });

      // Load KML as a layer (for icons + styles)
      kmlLayer = new google.maps.KmlLayer({
        url: toAbsoluteUrl(KML_URL),  // KML layer needs an absolute URL
        map: map,
        preserveViewport: false,
        suppressInfoWindows: true,    // We'll show our own InfoWindow
      });

      // When a placemark is clicked on the map, show popup
      kmlLayer.addListener("click", (event) => {
        openPopup(event.featureData.name, event.featureData.infoWindowHtml, event.latLng);
      });

      // Build the left menu by fetching and parsing the KML ourselves
      // (KmlLayer does NOT provide a list API, so we parse the KML file)
      fetchAndBuildMenu();
    }

    // =========================
    // 4) POPUP HELPERS
    // =========================
    function openPopup(title, html, position) {
      // Wrap KML HTML inside our container so CSS can control images
      const safeHtml = `<div class="kml-popup">${html || ""}</div>`;

      infoWindow.setContent(safeHtml);
      infoWindow.setPosition(position);
      infoWindow.open({ map });
    }

    // =========================
    // 5) LEFT MENU (fetch + parse KML)
    // =========================
    async function fetchAndBuildMenu() {
      try {
        // Fetch the KML file from GitHub Pages
        const res = await fetch(KML_URL, { cache: "no-store" });
        if (!res.ok) throw new Error("Failed to fetch KML: " + res.status);

        const kmlText = await res.text();

        // Parse XML
        const parser = new DOMParser();
        const xml = parser.parseFromString(kmlText, "text/xml");

        // Detect parse errors
        const parseError = xml.getElementsByTagName("parsererror")[0];
        if (parseError) throw new Error("KML XML parse error");

        // Collect placemarks
        placemarks = extractPlacemarks(xml);

        // Render list
        renderList(placemarks);

        // Hook search
        const searchBox = document.getElementById("searchBox");
        searchBox.addEventListener("input", () => {
          const q = searchBox.value.trim().toLowerCase();
          const filtered = placemarks.filter(p => (p.name || "").toLowerCase().includes(q));
          renderList(filtered);
        });

      } catch (err) {
        console.error(err);
        alert(
          "Menu build failed.\n\n" +
          "Most common reasons:\n" +
          "1) projects.kml is not in the repo next to index.html\n" +
          "2) KML is not public / not reachable by GitHub Pages\n" +
          "3) The KML file has invalid XML\n\n" +
          "Check DevTools Console for details."
        );
      }
    }

    function extractPlacemarks(xml) {
      const result = [];
      const placemarkNodes = Array.from(xml.getElementsByTagName("Placemark"));

      for (const pm of placemarkNodes) {
        const name = textOfFirst(pm, "name") || "Untitled";

        // Description can be inside <description><![CDATA[...]]></description>
        const descriptionRaw = textOfFirst(pm, "description") || "";

        // Coordinates can appear under <Point><coordinates>lng,lat,alt</coordinates>
        const coordText = textOfFirst(pm, "coordinates");
        if (!coordText) continue;

        const coords = coordText.trim().split(/\s+/)[0]; // take first coordinate set
        const [lngStr, latStr] = coords.split(",");
        const lat = parseFloat(latStr);
        const lng = parseFloat(lngStr);

        if (!Number.isFinite(lat) || !Number.isFinite(lng)) continue;

        result.push({
          name,
          lat,
          lng,
          descriptionHtml: descriptionRaw, // This is HTML from KML (may include <img>)
        });
      }

      // Optional: sort by name
      result.sort((a, b) => (a.name || "").localeCompare(b.name || ""));
      return result;
    }

    function textOfFirst(parent, tagName) {
      const node = parent.getElementsByTagName(tagName)[0];
      return node ? node.textContent : "";
    }

    function renderList(items) {
      const listEl = document.getElementById("list");
      listEl.innerHTML = "";

      if (!items.length) {
        listEl.innerHTML = `<div style="padding:12px;color:#666;">No matches</div>`;
        return;
      }

      for (const item of items) {
        const row = document.createElement("div");
        row.className = "item";

        // Small dot icon (you can improve to match KML style if needed)
        const dot = document.createElement("div");
        dot.className = "dot";

        const textWrap = document.createElement("div");
        const nameEl = document.createElement("div");
        nameEl.className = "name";
        nameEl.textContent = item.name;

        const metaEl = document.createElement("div");
        metaEl.className = "meta";
        metaEl.textContent = `${item.lat.toFixed(5)}, ${item.lng.toFixed(5)}`;

        textWrap.appendChild(nameEl);
        textWrap.appendChild(metaEl);

        row.appendChild(dot);
        row.appendChild(textWrap);

        // Click on list item: pan/zoom and open the same popup
        row.addEventListener("click", () => {
          const pos = new google.maps.LatLng(item.lat, item.lng);
          map.panTo(pos);
          map.setZoom(Math.max(map.getZoom(), 14));
          openPopup(item.name, item.descriptionHtml, pos);
        });

        listEl.appendChild(row);
      }
    }

    // =========================
    // 6) URL HELPERS
    // =========================
    function toAbsoluteUrl(relativeOrAbsolute) {
      // KmlLayer prefers absolute URLs. This converts "./projects.kml" to full URL.
      const a = document.createElement("a");
      a.href = relativeOrAbsolute;
      return a.href;
    }

    // Expose initMap globally for the Google callback
    window.initMap = initMap;
  </script>

  <!--
    IMPORTANT:
    Replace YOUR_API_KEY with your real key.
    Also make sure the key is allowed for:
      https://dmitryscheglov.github.io/*
      https://dmitryscheglov.github.io/rcs-map-demo/*
    in Google Cloud Console → Credentials → API key → Website restrictions
  -->
  <script
    async
    src="https://maps.googleapis.com/maps/api/js?key=AIzaSyBQJdAz47je6PT8EWNTBQKKCKwbh1DbpLs&callback=initMap">
  </script>
</body>
</html>
