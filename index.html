<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>rcs construction Projects Map (Demo)</title>

  <style>
    html, body { height: 100%; margin: 0; font-family: Arial, sans-serif; }
    .topbar { padding: 12px 16px; border-bottom: 1px solid #e5e5e5; background: #fff; }

    .layout { display: flex; height: calc(100vh - 49px); }

    .sidebar {
      width: 216px;
      min-width: 200px;
      max-width: 320px;
      border-right: 1px solid #e5e5e5;
      background: #fff;
      display: flex;
      flex-direction: column;
    }

    .sidebar .search {
      padding: 12px;
      border-bottom: 1px solid #e5e5e5;
      background: #fff;
      position: sticky;
      top: 0;
      z-index: 5;
    }

    .sidebar input {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 14px;
    }

    .list { overflow: auto; padding: 8px; flex: 1; }

    .category {
      margin: 8px 0;
      border: 1px solid #eee;
      border-radius: 10px;
      overflow: hidden;
      background: #fff;
    }

    .cat-header {
      display: flex;
      justify-content: space-between;
      padding: 10px 12px;
      cursor: pointer;
      background: #fafafa;
      border-bottom: 1px solid #eee;
    }

    .cat-title { font-size: 14px; color: #111; }
    .cat-count { font-size: 12px; color: #666; }

    .cat-body { padding: 6px; display: none; }
    .category.open .cat-body { display: block; }

    .item {
      padding: 8px;
      border-radius: 8px;
      cursor: pointer;
      display: flex;
      gap: 10px;
    }
    .item:hover { background: #f6f6f6; }

    .icon img { width: 18px; height: 18px; }

    .name { font-size: 13px; }
    .meta { font-size: 11px; color: #666; }

    #map { flex: 1; }

    .kml-popup { max-width: 1050px; }

    .kml-popup img {
      max-width: 100%;
      height: auto;
      display: block;
      max-height: 400px;
      object-fit: contain;
    }

    /* NEW: title under image */
    .kml-popup-title {
      margin-top: 10px;
      font-size: 18px;
      line-height: 1.3;
      color: #111;
      text-align: center;
    }
  </style>
</head>

<body>
  <div class="topbar">rcs construction — Projects Map (Demo)</div>

  <div class="layout">
    <div class="sidebar">
      <div class="search">
        <input id="searchBox" type="text" placeholder="Search location name..." />
      </div>
      <div id="list" class="list"></div>
    </div>

    <div id="map"></div>
  </div>

  <script>
    const KML_URL = "./rcs construction Projects Crossing.kml?v=" + Date.now();

    const DEFAULT_CENTER = { lat: 44.6488, lng: -63.5752 };
    const DEFAULT_ZOOM = 6;

    let map;
    let infoWindow;
    let kmlLayer;
    let allPlacemarks = [];
    let grouped = new Map();

    function initMap() {
      map = new google.maps.Map(document.getElementById("map"), {
        zoom: DEFAULT_ZOOM,
        center: DEFAULT_CENTER,
        mapTypeId: google.maps.MapTypeId.SATELLITE
      });

      infoWindow = new google.maps.InfoWindow({ maxWidth: 1050 });

      kmlLayer = new google.maps.KmlLayer({
        url: KML_URL,
        map: map,
        suppressInfoWindows: true
      });

      kmlLayer.addListener("click", (event) => {
        openPopup(event.featureData.name, event.featureData.infoWindowHtml, event.latLng);
      });

      fetchAndBuildMenu();
    }

    // UPDATED POPUP
    function openPopup(title, html, position) {
      const safeHtml = `
        <div class="kml-popup">
          ${html || ""}
          <div class="kml-popup-title">${title || ""}</div>
        </div>
      `;
      infoWindow.setContent(safeHtml);
      infoWindow.setPosition(position);
      infoWindow.open({ map });
    }

    async function fetchAndBuildMenu() {
      const res = await fetch(KML_URL, { cache: "no-store" });
      const text = await res.text();

      const xml = new DOMParser().parseFromString(text, "text/xml");

      const placemarks = Array.from(xml.getElementsByTagName("Placemark")).map(pm => {
        const name = pm.getElementsByTagName("name")[0]?.textContent || "";
        const desc = pm.getElementsByTagName("description")[0]?.textContent || "";
        const coords = pm.getElementsByTagName("coordinates")[0]?.textContent.trim().split(",");
        return {
          name,
          descriptionHtml: desc,
          lat: parseFloat(coords[1]),
          lng: parseFloat(coords[0])
        };
      });

      allPlacemarks = placemarks;
      renderList(placemarks);
    }

    function renderList(items) {
      const list = document.getElementById("list");
      list.innerHTML = "";

      items.forEach(p => {
        const el = document.createElement("div");
        el.className = "item";
        el.innerHTML = `<div>${p.name}</div>`;
        el.onclick = () => {
          const pos = new google.maps.LatLng(p.lat, p.lng);
          map.panTo(pos);
          map.setZoom(14);
          openPopup(p.name, p.descriptionHtml, pos);
        };
        list.appendChild(el);
      });
    }

    window.initMap = initMap;
  </script>

  <script async
    src="https://maps.googleapis.com/maps/api/js?key=YOUR_API_KEY&callback=initMap">
  </script>
</body>
</html>
