<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>rcs construction Projects Map (Demo)</title>

  <style>
    html, body {
      height: 100%;
      margin: 0;
      font-family: Arial, sans-serif;
    }

    .topbar {
      padding: 12px 16px;
      border-bottom: 1px solid #e5e5e5;
      background: #fff;
    }

    .layout {
      display: flex;
      flex-direction: column;
      height: calc(100vh - 49px);
    }

    .main-area {
      display: flex;
      flex: 1;
      min-height: 0;
    }

    .sidebar {
      width: 216px;
      min-width: 200px;
      max-width: 320px;
      border-right: 1px solid #e5e5e5;
      background: #fff;
      display: flex;
      flex-direction: column;
    }

    .sidebar .search {
      padding: 12px;
      border-bottom: 1px solid #e5e5e5;
      background: #fff;
      position: sticky;
      top: 0;
      z-index: 5;
    }

    .sidebar input {
      width: 100%;
      box-sizing: border-box;
      padding: 10px 12px;
      border: 1px solid #ddd;
      border-radius: 8px;
      outline: none;
      font-size: 14px;
    }

    .list {
      overflow: auto;
      padding: 8px 8px 16px;
      flex: 1;
    }

    .category {
      margin: 8px 0;
      border: 1px solid #eee;
      border-radius: 10px;
      overflow: hidden;
      background: #fff;
    }

    .cat-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 10px 12px;
      cursor: pointer;
      background: #fafafa;
      border-bottom: 1px solid #eee;
      user-select: none;
    }

    .cat-title {
      font-size: 14px;
      color: #111;
    }

    .cat-count {
      font-size: 12px;
      color: #666;
    }

    .cat-body {
      padding: 6px 6px 8px;
      display: none;
    }

    .category.open .cat-body {
      display: block;
    }

    .item {
      padding: 8px 8px;
      border-radius: 8px;
      cursor: pointer;
      display: flex;
      gap: 10px;
      align-items: flex-start;
    }

    .item:hover {
      background: #f6f6f6;
    }

    .icon {
      width: 18px;
      height: 18px;
      margin-top: 2px;
      flex: 0 0 18px;
    }

    .icon img {
      width: 18px;
      height: 18px;
      display: block;
      object-fit: contain;
    }

    .icon .fallback-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #666;
      margin: 4px auto 0;
    }

    .text-wrap {
      flex: 1;
      min-width: 0;
    }

    .name {
      font-size: 13px;
      line-height: 1.2;
      color: #111;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .meta {
      font-size: 11px;
      color: #666;
      margin-top: 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    #map {
      flex: 1;
      min-width: 0;
    }

    .kml-popup {
      max-width: 1050px;
    }

    .kml-popup img {
      max-width: 100%;
      height: auto;
      display: block;
      max-height: 400px;
      object-fit: contain;
    }

    .kml-popup-title {
      margin-top: 10px;
      font-size: 18px;
      line-height: 1.3;
      color: #111;
      text-align: center;
    }

    .bottom-panel {
      border-top: 1px solid #e5e5e5;
      background: #fafafa;
      padding: 12px 14px;
      overflow: auto;
      max-height: 255px;
    }

    .panel-title {
      font-size: 14px;
      color: #111;
      margin-bottom: 10px;
    }

    .form-grid {
      display: grid;
      grid-template-columns: 180px 220px 220px 180px 180px 180px;
      gap: 10px 12px;
      align-items: end;
    }

    .field label {
      display: block;
      font-size: 12px;
      color: #444;
      margin-bottom: 4px;
    }

    .field input,
    .field select,
    .field textarea {
      width: 100%;
      box-sizing: border-box;
      border: 1px solid #ccc;
      border-radius: 6px;
      padding: 8px 10px;
      font-size: 13px;
      background: #fff;
    }

    .field textarea {
      resize: vertical;
      min-height: 70px;
    }

    .field-wide {
      grid-column: span 2;
    }

    .field-description {
      grid-column: span 2;
    }

    .button-row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 12px;
    }

    button {
      border: 1px solid #bbb;
      background: #fff;
      border-radius: 8px;
      padding: 9px 14px;
      font-size: 13px;
      cursor: pointer;
    }

    button:hover {
      background: #f1f1f1;
    }

    .status-line {
      margin-top: 10px;
      font-size: 12px;
      color: #555;
      min-height: 16px;
    }

    @media (max-width: 1400px) {
      .form-grid {
        grid-template-columns: repeat(4, minmax(160px, 1fr));
      }
      .field-description {
        grid-column: span 4;
      }
    }

    @media (max-width: 900px) {
      .main-area {
        flex-direction: column;
      }
      .sidebar {
        width: 100%;
        max-width: none;
        min-width: 0;
        border-right: none;
        border-bottom: 1px solid #e5e5e5;
        max-height: 250px;
      }
      .form-grid {
        grid-template-columns: repeat(2, minmax(160px, 1fr));
      }
      .field-description {
        grid-column: span 2;
      }
    }
  </style>
</head>

<body>
  <div class="topbar">rcs construction - Projects Map (Demo)</div>

  <div class="layout">
    <div class="main-area">
      <div class="sidebar">
        <div class="search">
          <input id="searchBox" type="text" placeholder="Search location name..." />
        </div>
        <div id="list" class="list"></div>
      </div>

      <div id="map"></div>
    </div>

    <div class="bottom-panel">
      <div class="panel-title">Add new project</div>

      <div class="form-grid">
        <div class="field">
          <label for="projectName">Project Name</label>
          <input id="projectName" type="text" />
        </div>

        <div class="field">
          <label for="clientName">Client</label>
          <input id="clientName" type="text" />
        </div>

        <div class="field field-wide">
          <label for="projectAddress">Address</label>
          <input id="projectAddress" type="text" placeholder="1565 Argyle Street, Halifax, NS" />
        </div>

        <div class="field">
          <label for="coordLat">Latitude</label>
          <input id="coordLat" type="text" placeholder="44.6488" />
        </div>

        <div class="field">
          <label for="coordLng">Longitude</label>
          <input id="coordLng" type="text" placeholder="-63.5752" />
        </div>

        <div class="field">
          <label for="imageUrl">URL image</label>
          <input id="imageUrl" type="text" />
        </div>

        <div class="field">
          <label for="sectorSelect">Sector</label>
          <select id="sectorSelect">
            <option value="Corporate Office">Corporate Office</option>
            <option value="Hospitality">Hospitality</option>
            <option value="Industrial">Industrial</option>
            <option value="Institutional">Institutional</option>
            <option value="Multi-Residential">Multi-Residential</option>
            <option value="Retail">Retail</option>
          </select>
        </div>

        <div class="field">
          <label for="statusSelect">Status</label>
          <select id="statusSelect">
            <option value="Completed">Completed</option>
            <option value="Under Construction">Under Construction</option>
          </select>
        </div>

        <div class="field field-description">
          <label for="descriptionText">Description</label>
          <textarea id="descriptionText" placeholder="Optional description"></textarea>
        </div>
      </div>

      <div class="button-row">
        <button id="testLocationBtn" type="button">Test location</button>
        <button id="addLocationBtn" type="button">Add new location</button>
        <button id="downloadKmlBtn" type="button">Download updated KML</button>
      </div>

      <div id="statusLine" class="status-line"></div>
    </div>
  </div>

  <script>
    const KML_URL = "./rcs construction Projects Crossing.kml?v=" + Date.now();

    const DEFAULT_CENTER = { lat: 44.6488, lng: -63.5752 };
    const DEFAULT_ZOOM = 6;

    let map;
    let infoWindow;
    let kmlLayer;
    let geocoder;

    let allPlacemarks = [];
    let grouped = new Map();

    const styleIconById = new Map();
    const styleMapNormalById = new Map();

    let originalXmlDoc = null;
    let manuallyAddedPlacemarks = [];
    let manualMarkers = [];

    function initMap() {
      map = new google.maps.Map(document.getElementById("map"), {
        zoom: DEFAULT_ZOOM,
        center: DEFAULT_CENTER,
        mapTypeId: google.maps.MapTypeId.SATELLITE,
        mapTypeControl: true
      });

      geocoder = new google.maps.Geocoder();
      infoWindow = new google.maps.InfoWindow({ maxWidth: 1050 });

      kmlLayer = new google.maps.KmlLayer({
        url: toAbsoluteUrl(KML_URL),
        map: map,
        preserveViewport: false,
        suppressInfoWindows: true
      });

      kmlLayer.addListener("click", (event) => {
        openPopup(event.featureData.name, event.featureData.infoWindowHtml, event.latLng);
      });

      fetchAndBuildMenu();
      bindBottomPanel();
    }

    function openPopup(title, html, position) {
      const wrapper = document.createElement("div");
      wrapper.innerHTML = html || "";

      const popup = document.createElement("div");
      popup.className = "kml-popup";

      while (wrapper.firstChild) {
        popup.appendChild(wrapper.firstChild);
      }

      const titleEl = document.createElement("div");
      titleEl.className = "kml-popup-title";
      titleEl.textContent = title || "";

      popup.appendChild(titleEl);

      infoWindow.setContent(popup);
      infoWindow.setPosition(position);
      infoWindow.open({ map });
    }

    async function fetchAndBuildMenu() {
      try {
        const res = await fetch(KML_URL, { cache: "no-store" });
        if (!res.ok) throw new Error("Failed to fetch KML: " + res.status);

        const kmlText = await res.text();

        const parser = new DOMParser();
        const xml = parser.parseFromString(kmlText, "text/xml");

        const parseError = xml.getElementsByTagName("parsererror")[0];
        if (parseError) throw new Error("KML XML parse error");

        originalXmlDoc = xml;

        buildStyleTables(xml);

        const placemarks = extractPlacemarksWithFolders(xml);
        allPlacemarks = placemarks;
        grouped = groupByCategory(allPlacemarks);
        renderGroupedList(grouped);

        const searchBox = document.getElementById("searchBox");
        searchBox.addEventListener("input", applySearchFilter);

      } catch (err) {
        console.error(err);
        setStatus("Failed to load KML. Open console for details.");
      }
    }

    function buildStyleTables(xml) {
      styleIconById.clear();
      styleMapNormalById.clear();

      const styles = Array.from(xml.getElementsByTagName("Style"));
      for (const st of styles) {
        const id = st.getAttribute("id");
        if (!id) continue;

        const iconHref = firstText(st);
        if (iconHref) styleIconById.set("#" + id, iconHref);
      }

      const styleMaps = Array.from(xml.getElementsByTagName("StyleMap"));
      for (const sm of styleMaps) {
        const id = sm.getAttribute("id");
        if (!id) continue;

        const pairs = Array.from(sm.getElementsByTagName("Pair"));
        for (const pair of pairs) {
          const key = textOfFirst(pair, "key");
          const styleUrl = textOfFirst(pair, "styleUrl");
          if (key === "normal" && styleUrl) {
            styleMapNormalById.set("#" + id, styleUrl.trim());
          }
        }
      }
    }

    function firstText(styleNode) {
      const iconStyle = styleNode.getElementsByTagName("IconStyle")[0];
      if (!iconStyle) return "";
      const icon = iconStyle.getElementsByTagName("Icon")[0];
      if (!icon) return "";
      const href = icon.getElementsByTagName("href")[0];
      return href ? href.textContent.trim() : "";
    }

    function resolveIconHref(styleUrl) {
      if (!styleUrl) return "";
      const resolved = styleMapNormalById.get(styleUrl) || styleUrl;
      return styleIconById.get(resolved) || "";
    }

    function extractPlacemarksWithFolders(xml) {
      const results = [];
      const doc = xml.getElementsByTagName("Document")[0] || xml;

      walkContainer(doc, [], results);

      results.sort((a, b) => (a.categoryPath + a.name).localeCompare(b.categoryPath + b.name));
      return results;
    }

    function walkContainer(node, pathParts, out) {
      if (node.tagName === "Folder") {
        const folderName = textOfFirst(node, "name") || "Unnamed";
        pathParts = [...pathParts, folderName];
      }

      const placemarks = Array.from(node.children).filter(ch => ch.tagName === "Placemark");
      for (const pm of placemarks) {
        const name = textOfFirst(pm, "name") || "Untitled";
        const descriptionHtml = textOfFirst(pm, "description") || "";

        const coordText = textOfFirst(pm, "coordinates");
        if (!coordText) continue;

        const coords = coordText.trim().split(/\s+/)[0];
        const [lngStr, latStr] = coords.split(",");
        const lat = parseFloat(latStr);
        const lng = parseFloat(lngStr);
        if (!Number.isFinite(lat) || !Number.isFinite(lng)) continue;

        const styleUrl = (textOfFirst(pm, "styleUrl") || "").trim();
        const iconHref = resolveIconHref(styleUrl);

        out.push({
          name,
          lat,
          lng,
          descriptionHtml,
          iconHref,
          categoryPath: pathParts.join(" > ") || "Uncategorized",
          isManual: false
        });
      }

      const childFolders = Array.from(node.children).filter(ch => ch.tagName === "Folder");
      for (const f of childFolders) {
        walkContainer(f, pathParts, out);
      }
    }

    function textOfFirst(parent, tagName) {
      const node = parent.getElementsByTagName(tagName)[0];
      return node ? node.textContent : "";
    }

    function groupByCategory(items) {
      const map = new Map();
      for (const p of items) {
        const key = p.categoryPath || "Uncategorized";
        if (!map.has(key)) map.set(key, []);
        map.get(key).push(p);
      }
      return new Map([...map.entries()].sort((a, b) => a[0].localeCompare(b[0])));
    }

    function renderGroupedList(groupedMap) {
      const listEl = document.getElementById("list");
      listEl.innerHTML = "";

      if (!groupedMap.size) {
        listEl.innerHTML = `<div style="padding:12px;color:#666;">No matches</div>`;
        return;
      }

      for (const [catName, items] of groupedMap.entries()) {
        const cat = document.createElement("div");
        cat.className = "category open";

        const header = document.createElement("div");
        header.className = "cat-header";

        const left = document.createElement("div");
        left.className = "cat-title";
        left.textContent = catName;

        const right = document.createElement("div");
        right.className = "cat-count";
        right.textContent = items.length;

        header.appendChild(left);
        header.appendChild(right);

        header.addEventListener("click", () => {
          cat.classList.toggle("open");
        });

        const body = document.createElement("div");
        body.className = "cat-body";

        for (const item of items) {
          body.appendChild(renderItemRow(item));
        }

        cat.appendChild(header);
        cat.appendChild(body);
        listEl.appendChild(cat);
      }
    }

    function renderItemRow(item) {
      const row = document.createElement("div");
      row.className = "item";

      const iconWrap = document.createElement("div");
      iconWrap.className = "icon";

      if (item.iconHref) {
        const img = document.createElement("img");
        img.src = item.iconHref;
        img.alt = "";
        iconWrap.appendChild(img);
      } else {
        const dot = document.createElement("div");
        dot.className = "fallback-dot";
        iconWrap.appendChild(dot);
      }

      const textWrap = document.createElement("div");
      textWrap.className = "text-wrap";

      const nameEl = document.createElement("div");
      nameEl.className = "name";
      nameEl.textContent = item.name;

      const metaEl = document.createElement("div");
      metaEl.className = "meta";
      metaEl.textContent = `${item.lat.toFixed(5)}, ${item.lng.toFixed(5)}`;

      textWrap.appendChild(nameEl);
      textWrap.appendChild(metaEl);

      row.appendChild(iconWrap);
      row.appendChild(textWrap);

      row.addEventListener("click", () => {
        const pos = new google.maps.LatLng(item.lat, item.lng);
        map.panTo(pos);
        map.setZoom(Math.max(map.getZoom(), 14));
        openPopup(item.name, item.descriptionHtml, pos);
      });

      return row;
    }

    function bindBottomPanel() {
      document.getElementById("testLocationBtn").addEventListener("click", async () => {
        try {
          const pos = await getLocationFromForm();
          map.panTo(pos);
          map.setZoom(16);
          setStatus(`Location found: ${pos.lat.toFixed(6)}, ${pos.lng.toFixed(6)}`);
        } catch (err) {
          setStatus(err.message);
        }
      });

      document.getElementById("addLocationBtn").addEventListener("click", async () => {
        try {
          const newPlacemark = await buildManualPlacemarkFromForm();
          manuallyAddedPlacemarks.push(newPlacemark);
          addManualMarker(newPlacemark);
          allPlacemarks.push(newPlacemark);
          applySearchFilter();
          clearEntryFields();
          setStatus(`Added: ${newPlacemark.name}`);
        } catch (err) {
          setStatus(err.message);
        }
      });

      document.getElementById("downloadKmlBtn").addEventListener("click", () => {
        try {
          downloadUpdatedKml();
          setStatus("Updated KML downloaded.");
        } catch (err) {
          setStatus("Failed to generate KML.");
          console.error(err);
        }
      });
    }

    async function getLocationFromForm() {
      const address = document.getElementById("projectAddress").value.trim();
      const latValue = document.getElementById("coordLat").value.trim();
      const lngValue = document.getElementById("coordLng").value.trim();

      if (latValue && lngValue) {
        const lat = parseFloat(latValue);
        const lng = parseFloat(lngValue);
        if (!Number.isFinite(lat) || !Number.isFinite(lng)) {
          throw new Error("Invalid coordinates.");
        }
        return { lat, lng };
      }

      if (!address) {
        throw new Error("Enter address or coordinates.");
      }

      const pos = await geocodeAddress(address);
      document.getElementById("coordLat").value = pos.lat.toFixed(6);
      document.getElementById("coordLng").value = pos.lng.toFixed(6);
      return pos;
    }

    function geocodeAddress(address) {
      return new Promise((resolve, reject) => {
        geocoder.geocode({ address }, (results, status) => {
          if (status === "OK" && results && results[0]) {
            const loc = results[0].geometry.location;
            resolve({
              lat: loc.lat(),
              lng: loc.lng()
            });
          } else {
            reject(new Error("Address not found."));
          }
        });
      });
    }

    async function buildManualPlacemarkFromForm() {
      const name = document.getElementById("projectName").value.trim();
      const client = document.getElementById("clientName").value.trim();
      const address = document.getElementById("projectAddress").value.trim();
      const imageUrl = document.getElementById("imageUrl").value.trim();
      const sector = document.getElementById("sectorSelect").value;
      const status = document.getElementById("statusSelect").value;
      const description = document.getElementById("descriptionText").value.trim();

      if (!name) {
        throw new Error("Project Name is required.");
      }

      const pos = await getLocationFromForm();
      const iconHref = getManualIconBySector(sector);

      const descriptionHtml = buildDescriptionHtml({
        name,
        client,
        address,
        imageUrl,
        sector,
        status,
        description
      });

      return {
        name,
        lat: pos.lat,
        lng: pos.lng,
        descriptionHtml,
        iconHref,
        categoryPath: `rcs construction Projects > ${sector} > ${status}`,
        isManual: true,
        client,
        address,
        imageUrl,
        sector,
        status,
        description
      };
    }

    function buildDescriptionHtml(data) {
      const parts = [];

      if (data.imageUrl) {
        parts.push(`<img src="${escapeHtmlAttr(data.imageUrl)}" alt="">`);
      }

      if (data.client) {
        parts.push(`<div>Client: ${escapeHtmlText(data.client)}</div>`);
      }

      if (data.address) {
        parts.push(`<div>Address: ${escapeHtmlText(data.address)}</div>`);
      }

      if (data.sector) {
        parts.push(`<div>Sector: ${escapeHtmlText(data.sector)}</div>`);
      }

      if (data.status) {
        parts.push(`<div>Status: ${escapeHtmlText(data.status)}</div>`);
      }

      if (data.description) {
        parts.push(`<div style="margin-top:8px;">${escapeHtmlText(data.description)}</div>`);
      }

      return parts.join("");
    }

    function addManualMarker(item) {
      const marker = new google.maps.Marker({
        position: { lat: item.lat, lng: item.lng },
        map,
        title: item.name,
        icon: {
          url: item.iconHref || "http://maps.google.com/mapfiles/kml/pushpin/red-pushpin.png",
          scaledSize: new google.maps.Size(32, 32)
        }
      });

      marker.addListener("click", () => {
        openPopup(item.name, item.descriptionHtml, marker.getPosition());
      });

      manualMarkers.push(marker);
    }

    function getManualIconBySector(sector) {
      const icons = {
        "Corporate Office": "http://maps.google.com/mapfiles/kml/pushpin/wht-pushpin.png",
        "Hospitality": "http://maps.google.com/mapfiles/kml/pushpin/pink-pushpin.png",
        "Industrial": "http://maps.google.com/mapfiles/kml/pushpin/ylw-pushpin.png",
        "Institutional": "http://maps.google.com/mapfiles/kml/pushpin/blu-pushpin.png",
        "Multi-Residential": "http://maps.google.com/mapfiles/kml/pushpin/ltblu-pushpin.png",
        "Retail": "http://maps.google.com/mapfiles/kml/pushpin/grn-pushpin.png"
      };
      return icons[sector] || "http://maps.google.com/mapfiles/kml/pushpin/red-pushpin.png";
    }

    function applySearchFilter() {
      const q = document.getElementById("searchBox").value.trim().toLowerCase();
      const filtered = q
        ? allPlacemarks.filter(p => (p.name || "").toLowerCase().includes(q))
        : allPlacemarks;

      const groupedFiltered = groupByCategory(filtered);
      renderGroupedList(groupedFiltered);
    }

    function clearEntryFields() {
      document.getElementById("projectName").value = "";
      document.getElementById("clientName").value = "";
      document.getElementById("projectAddress").value = "";
      document.getElementById("coordLat").value = "";
      document.getElementById("coordLng").value = "";
      document.getElementById("imageUrl").value = "";
      document.getElementById("descriptionText").value = "";
      document.getElementById("sectorSelect").value = "Corporate Office";
      document.getElementById("statusSelect").value = "Completed";
    }

    function downloadUpdatedKml() {
      if (!originalXmlDoc) {
        throw new Error("Original KML not loaded.");
      }

      const serializer = new XMLSerializer();
      const xmlClone = originalXmlDoc.cloneNode(true);

      const documentNode = xmlClone.getElementsByTagName("Document")[0];
      if (!documentNode) {
        throw new Error("Document node not found in KML.");
      }

      let manualFolder = null;
      const existingFolders = Array.from(documentNode.children).filter(ch => ch.tagName === "Folder");

      for (const folder of existingFolders) {
        const folderNameNode = folder.getElementsByTagName("name")[0];
        if (folderNameNode && folderNameNode.textContent === "Added manually") {
          manualFolder = folder;
          break;
        }
      }

      if (!manualFolder) {
        manualFolder = xmlClone.createElement("Folder");
        const folderName = xmlClone.createElement("name");
        folderName.textContent = "Added manually";
        manualFolder.appendChild(folderName);
        documentNode.appendChild(manualFolder);
      }

      manuallyAddedPlacemarks.forEach(item => {
        const pm = xmlClone.createElement("Placemark");

        const nameNode = xmlClone.createElement("name");
        nameNode.textContent = item.name;
        pm.appendChild(nameNode);

        const descNode = xmlClone.createElement("description");
        descNode.appendChild(xmlClone.createCDATASection(item.descriptionHtml || ""));
        pm.appendChild(descNode);

        const pointNode = xmlClone.createElement("Point");
        const coordsNode = xmlClone.createElement("coordinates");
        coordsNode.textContent = `${item.lng},${item.lat},0`;
        pointNode.appendChild(coordsNode);
        pm.appendChild(pointNode);

        manualFolder.appendChild(pm);
      });

      const xmlString = `<?xml version="1.0" encoding="UTF-8"?>\n` + serializer.serializeToString(xmlClone);

      const blob = new Blob([xmlString], { type: "application/vnd.google-earth.kml+xml;charset=utf-8" });
      const url = URL.createObjectURL(blob);

      const a = document.createElement("a");
      a.href = url;
      a.download = "rcs construction Projects Crossing updated.kml";
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);

      setTimeout(() => URL.revokeObjectURL(url), 1000);
    }

    function escapeHtmlText(text) {
      const div = document.createElement("div");
      div.textContent = text || "";
      return div.innerHTML;
    }

    function escapeHtmlAttr(text) {
      return String(text || "")
        .replace(/&/g, "&amp;")
        .replace(/"/g, "&quot;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;");
    }

    function toAbsoluteUrl(relativeOrAbsolute) {
      const a = document.createElement("a");
      a.href = relativeOrAbsolute;
      return a.href;
    }

    function setStatus(message) {
      document.getElementById("statusLine").textContent = message || "";
    }

    window.initMap = initMap;
  </script>

  <script async
    src="https://maps.googleapis.com/maps/api/js?key=AIzaSyBQJdAz47je6PT8EWNTBQKKCKwbh1DbpLs&callback=initMap">
  </script>
</body>
</html>
